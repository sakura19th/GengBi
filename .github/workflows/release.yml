name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe & release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
        run: python -m novelforge.resources.build

      - name: Read version & release notes
        id: meta
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          init_text = Path("novelforge/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_text)
          version = m.group(1) if m else "0.0.0"
          tag = f"v{version}"

          readme = Path("README.md").read_text(encoding="utf-8")
          sec = re.search(
              rf"^### v{re.escape(version)}\s*$(.*?)(?=^### v|\Z)",
              readme,
              re.M | re.S,
          )
          notes = sec.group(1).strip() if sec else f"### {tag}\n\n自动构建发布。"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")
              f.write(f"notes<<EOF\n{notes}\nEOF\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.notes }}
          files: dist/GengBi_v${{ steps.meta.outputs.version }}.exe
          fail_on_unmatched_files: true
